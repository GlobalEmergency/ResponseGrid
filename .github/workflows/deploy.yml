name: Deploy API (srv07)

# Autodeploy de la API en srv07 encadenado a la CI: solo arranca cuando el
# workflow `CI` termina en verde para un push a main. Nada se publica sin pasar
# el gate. (La web la despliega la integración Git de Vercel, aparte.)
#
# La clave `SRV07_DEPLOY_KEY` entra como root pero está atada a un *forced
# command* en /root/.ssh/authorized_keys: sshd ejecuta siempre
# /usr/local/sbin/responsegrid-deploy e ignora lo que mande el cliente. Es decir,
# esta clave no puede hacer nada más que desplegar, y el script de deploy vive en
# el servidor (con git reset --hard, build, migraciones y health check).
# El `script:` de abajo existe solo porque la action lo exige.
#
# Como el servidor despliega la punta de main y no un sha concreto, el job `gate`
# exige que el sha que pasó la CI siga siendo la punta de main: si main ya avanzó,
# se salta y despliega la ejecución de la CI del commit más reciente.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# El gate solo lee el repo; el deploy solo usa secretos.
permissions:
  contents: read

jobs:
  gate:
    name: Gate
    runs-on: ubuntu-latest
    # Solo pushes a main de este mismo repo con la CI en verde: una PR desde un
    # fork con una rama llamada «main» también dispara workflow_run.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    outputs:
      deploy: ${{ steps.scope.outputs.deploy }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Decidir si se despliega
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          tip=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$tip" != "$TESTED_SHA" ]; then
            echo "::notice::main ya está en ${tip:0:8} (la CI probó ${TESTED_SHA:0:8}); despliega la CI del commit más reciente."
            exit 0
          fi

          # main es squash-only y sin push directo: cada push es un único commit.
          changed=$(git diff --name-only HEAD^ HEAD)
          echo "$changed"
          if echo "$changed" | grep -qE '^(apps/api/|packages/|deploy/|package\.json$|pnpm-workspace\.yaml$|pnpm-lock\.yaml$|\.github/workflows/deploy\.yml$)'; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::El commit no toca la API: no hay nada que desplegar."
          fi

  deploy:
    name: Deploy
    needs: gate
    if: needs.gate.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-api-srv07
      cancel-in-progress: false
    steps:
      - name: SSH deploy to srv07
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        with:
          host: ${{ secrets.SRV07_HOST }}
          username: ${{ secrets.SRV07_USER }}
          key: ${{ secrets.SRV07_DEPLOY_KEY }}
          command_timeout: 20m
          script: |
            true
